<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="../styles.css"
    />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Yolo County Forecasting</title>
  </head>

  <body>
    <div data-site-header-placeholder></div>

    <!-- Clear Lake Precipitation -->
    <!-- <div  
        class="chart"
        data-title="Clear Lake Precipitation"
        data-subtitle="Water Year: {wyRange}"
        data-stacked="false"
        data-source-units="in"
        data-units="in"
        data-series='[
            { "csv": "../Data/Cumulative Precip-Clear Lake.csv", "name": "Forecast", "y": "Baseline", "type": "line"},
            { "csv": "../Data/1991-2020 Cumalitive Avg Precipitation.csv", "name": "1991-2020 Average", "y": "Clear Lake", "type": "area", "dashFromCurrentMonth": false}
        ]'
    ></div> -->

    <div class="layout">
      <div class="container page-content">

        
        <!-- Plotly -->
        <div
          id="water-table-map"
          class="plotly-map"
          data-title="Water Table Elevation, Depth to Water, and Potentially Impacted Wells"
          data-grid-geojson="../geojson files/WTandDTW.geojson"
          data-grid-layers='[
            { "value": "WT", "label": "Water Table Elevation (ft)", "name": "Water Table Elevation" },
            { "value": "DTW", "label": "Depth to Water (ft)", "name": "Depth to Water", "visible": "legendonly" }
          ]'
          data-points-geojson="../Data/ImpactedWells.geojson"
          data-point-name="Potentially Impacted Wells"
        ></div>

        <!-- Groundwater Storage -->
        <div
          id="groundwater-storage"
          class="chart"
          data-title="Monthly Change in Groundwater Storage"
          data-subtitle="Water Year: {wyRange}"
          data-stacked="false"
          data-note="Displays the change in storage from previous month.<br>Solid lines represent simulated historical values. Dashed lines represent simulated forecasted values."
          data-series='[
                    { "csv": "../Data/Groundwater Storage.csv", "name": "Storage Change", "y": "Baseline", "type": "line", "dashFromCurrentMonth": true, "monthlyChange": true }
                ]'
        ></div>

        <!--  Representative Monitoring Wells - Average Depth to Water -->
        <!-- data-note="All data is simulated." -->
        <div
          id="representative-monitoring-wells"
          class="chart"
          data-title="Representative Monitoring Wells - Average Depth to Water"
          data-subtitle="Water Years {startyear}-{endyear}"
          data-stacked="false"
          data-inverse-y-axis="true"
          data-y-axis-name="Depth to Water (ft)"
          data-x-axis-data="points"
          data-x-axis-label-rotate="90"
          data-x-axis-labels="year"
          data-condition-bands="true"
          data-condition-bands-csv="../Data/Water Year Types.csv"
          data-note="Solid lines represent simulated historical values. Dashed lines represent simulated forecasted values."
          data-series='[
                { "csvHistorical": "../Data/Historical RMW Avg DTW.csv", "csvForecast": "../Data/RMW Avg DTW.csv", "stitch": "back-to-back", "name": "Simulated Average Groundwater Level", "y": "Avg Depth to Water (ft)", "units": "ft", "sourceUnits": "ft", "type": "line", "dashFromCurrentMonth": true, "color": "#666666", "showSymbol": false, "connectNulls": true},
                { "csv": "../Data/Observed RMW Avg DTW.csv", "stitch": "back-to-back", "name": "Observed Average Groundwater Level", "y": "Avg Depth to Water (ft)", "units": "ft", "sourceUnits": "ft", "type": "line", "dashFromCurrentMonth": false, "color": "red", "symbolSize": 0 }
                ]'
        ></div>

        <!-- Example of multiple series stitched -->
        <!-- Rule: files are applied in order. If dates overlap, the earlier file wins. -->
        <!-- data-series='[
          {
            "csvs": [
              "../Data/Older Historical RMW Avg DTW.csv",
              "../Data/Historical RMW Avg DTW.csv",
              "../Data/RMW Avg DTW.csv"
            ],
            "stitch": "back-to-back",
            "name": "Average Groundwater Level",
            "y": "Avg Depth to Water (ft)",
            "units": "ft",
            "sourceUnits": "ft",
            "type": "line",
            "dashFromCurrentMonth": false,
            "color": "red"
          }
        ]' -->

        <!-- Table of Budget Numbers -->
        <!-- If data-year is empty, assume current water year -->
        <div id="data">
          <div class="single-value-grid">
            <div
              class="single-value"
              data-label="Total Ag Demand"
              data-csv="../Data/Total Ag Demand.csv"
              data-col="Baseline"
              data-units="TAF"
            ></div>

            <div
              class="single-value"
              data-label="Ag GW Extraction"
              data-csv="../Data/Ag GW Extraction.csv"
              data-col="Baseline"
              data-units="TAF"
            ></div>

            <div
              class="single-value"
              data-label="Ag SW Diversions"
              data-csv="../Data/Ag SW Diversions.csv"
              data-col="Baseline"
              data-units="TAF"
            ></div>

            <div
              class="single-value"
              data-label="Actual ET"
              data-csv="../Data/ETActual (including irrigation).csv"
              data-col="Baseline"
              data-units="TAF"
            ></div>
          </div>

          <br />

          <div class="single-value-grid">
            <div
              class="single-value"
              data-label="Total Groundwater Extraction"
              data-csv="../Data/Total GW Extraction.csv"
              data-col="Baseline"
              data-units="TAF"
            ></div>

            <div
              class="single-value"
              data-label="Total SW Diversions"
              data-csv="../Data/Total SW Diversions.csv"
              data-col="Baseline"
              data-units="TAF"
            ></div>

            <div
              class="single-value"
              data-label="Urban GW Extractions"
              data-csv="../Data/Urban GW Extraction.csv"
              data-col="Baseline"
              data-units="TAF"
            ></div>

            <div
              class="single-value"
              data-label="Urban SW Diversions"
              data-csv="../Data/Urban SW Diversions.csv"
              data-col="Baseline"
              data-units="TAF"
            ></div>
          </div>
        </div>
      </div>

      <br /><br />

      <!-- Change in GW Storage – use Forecast Outputs\Groundwater Storage – use Sep of forecast year minus Sep of year before forecast year  -->
      <div class="container">
        <div class="single-value-grid">
          <div
            class="single-value"
            data-key="GW_Current"
            data-label="{year} End of Year Storage"
            data-csv="../Data/Groundwater Storage.csv"
            data-col="Baseline"
            data-month="Sep"
            data-year="current"
            data-units="TAF"
          ></div>

          <!-- Add Previous field for single values -->
          <div
            class="single-value"
            data-key="GW_Previous"
            data-label="{prevyear} End of Year Storage"
            data-csv="../Data/Groundwater Storage.csv"
            data-col="Baseline"
            data-month="Sep"
            data-year="previous"
            data-units="TAF"
          ></div>

          <div
            class="single-value"
            data-key="diff"
            data-label="Change in Storage"
            data-diff="GW_Current,GW_Previous"
            data-units="TAF"
          ></div>
        </div>
      </div>
    </div>

    <br /><br />
    <!-- </main> -->

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="../header-loader.js"></script>
    <script src="../parse-data.js"></script>
  </body>
</html>
